[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hexaflake-research"
version = "0.1.0.dev0"
description = "Bounded geometric computation research components"
readme = "README.md"
license = {text = "Apache-2.0; CPython-derived portion under Python license"}
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/CPython.txt"]
py-modules = ["Hexaflag", "CGC120"]

[tool.setuptools.packages.find]
where = ["."]
include = ["GEO144K", "src"]
namespaces = true

[tool.setuptools.data-files]
"share/hexaflake" = ["HCA88.c", "HCA88.h"]
